{% extends "base.html" %}
{% block page_title %}Wachtwoord wijzigen{% endblock %}
{% block page_subtitle %}Wijzig je eigen wachtwoord.{% endblock %}
{% block content %}
<div class="card form-card" style="max-width:480px">
  <form method="post" class="form-grid single">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Huidig wachtwoord
      <input type="password" name="current_password" required autocomplete="current-password">
    </label>
    <label>Nieuw wachtwoord
      <input type="password" name="new_password" minlength="10" required autocomplete="new-password">
      <small>Minimaal 10 tekens.</small>
    </label>
    <label>Nieuw wachtwoord herhalen
      <input type="password" name="new_password_repeat" minlength="10" required autocomplete="new-password">
    </label>
    <button class="btn primary" type="submit">Wachtwoord wijzigen</button>
  </form>
</div>
{% endblock %}
